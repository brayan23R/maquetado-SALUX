class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood || 'happy';
    const w = this.props.w || 200;
    const ell = (x) => 'M' + x + ' 80a6 9 0 100 18 6 9 0 100-18z';

    if (mood === 'cheer') {
      Object.assign(o, { eyeL: 'M72 92q10-14 20 0', eyeR: 'M108 92q10-14 20 0', ef: 'none', hl: '0', mouth: 'M86 100q14 18 28 0z', mf: '#FF8FA3', armL: 'rotate(150 57 152)', armR: 'rotate(-150 143 152)', spk: '1', label: 'Mascota de SALUX celebrando' });
    } else if (mood === 'sad') {
      Object.assign(o, { brows: 'M72 72l16 5M128 72l-16 5', mouth: 'M91 111q9-9 18 0', tear: '1', armL: 'rotate(4 57 168)', armR: 'rotate(-4 143 168)', label: 'Mascota de SALUX triste' });

    } else if (mood === 'love') {
      Object.assign(o, { eyeL: heart(82), eyeR: heart(118), ef: '#FF5E87', es: '#FF5E87', hl: '0', mouth: 'M88 100q12 14 24 0z', mf: '#FF8FA3', spk: '1', label: 'Mascota de SALUX enamorada' });
    } else if (mood === 'think') {
      Object.assign(o, { eyeL: 'M86 80a6 9 0 100 18 6 9 0 100-18z', eyeR: 'M122 80a6 9 0 100 18 6 9 0 100-18z', brows: 'M110 70q10-6 20-1', mouth: 'M95 107h10', th: '1', armR: 'rotate(-70 143 160)', label: 'Mascota de SALUX pensando' });
    }
    o.w = w; o.h = Math.round(w * 1.2);
    return o;
  }
